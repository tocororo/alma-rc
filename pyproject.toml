[project]
name = "alma-rc"
version = "0.1.0"
description = "DSpace to InvenioRDM migration tool for ALMA repository"
authors = [
    {name = "Rafael Martinez Estevez", email = "malayibiri@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Topic :: Text Processing",
]
dependencies = [
    "lxml >=6.0.0,<7.0.0",
    "sickle >=0.7.0,<1.0.0",
    "datamodel-code-generator >=0.33.0,<0.34.0",
    "requests >=2.32.4,<3.0.0",
    "pydantic >=1.10.22,<2.0.0",
    "pandas >=2.3.3,<3.0.0",
    "rapidfuzz >=3.14.1,<4.0.0",
    "pycountry >=24.6.1,<25.0.0",
    "dateparser >=1.2.2,<2.0.0",
    "python-dotenv >=1.2.1,<2.0.0",
    "idutils >=1.5.0,<2.0.0",
    "certifi >=2025.7.14",
    "chardet >=3.0.4,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "black >=25.1.0",
    "isort >=6.0.1",
    "pytest >=8.2.0",
    "pytest-cov >=5.0.0",
    "mypy >=1.10.0",
    "flake8 >=7.1.0",
]

[project.urls]
Homepage = "https://github.com/tocororo/alma-rc"
Repository = "https://github.com/tocororo/alma-rc"
Issues = "https://github.com/tocororo/alma-rc/issues"

[project.scripts]
alma-rc = "alma_rc.insert_data.import:main"
alma-rc-ftp = "alma_rc.ftp_collector.collector:main"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=alma_rc --cov-report=term-missing"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"